# fly.toml app configuration for NAFI Backend
# See https://fly.io/docs/reference/configuration/ for reference

app = "nafi-backend"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[[mounts]]
  source = "pg_data"
  destination = "/var/lib/postgresql/data"
  initial_size = "1gb"

[checks]
  [checks.health]
    port = 3000
    path = "/api/v1/health/live"
    interval = "10s"
    timeout = "5s"

  [checks.ready]
    port = 3000
    path = "/api/v1/health/ready"
    interval = "10s"
    timeout = "5s"
