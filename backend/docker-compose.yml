version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: nafi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-nafi}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nafi_password}
      POSTGRES_DB: ${DB_NAME:-nafi_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/mysql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${DB_USER:-nafi} -d ${DB_NAME:-nafi_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: nafi-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: mysql://${DB_USER:-nafi}:${DB_PASSWORD:-nafi_password}@db:5432/${DB_NAME:-nafi_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_change_in_production}
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma migrate dev && npm run dev"

volumes:
  postgres_data:
