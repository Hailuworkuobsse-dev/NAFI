app = "nafi-api"
primary_region = "jnb"

[build]
  dockerfile = "services/api/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "4000"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 2

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/api/v1/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"

[deploy]
  strategy = "rolling"
